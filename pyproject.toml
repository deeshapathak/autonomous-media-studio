[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-media-studio"
version = "0.1.0"
description = "A curated local H3 orchestration showcase with a verified generated artifact"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
media-studio = "media_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
